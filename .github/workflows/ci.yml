name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check-and-test:
    name: Lint, Test & Validate
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Frontend Dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend Code Style (ESLint)
        run: pnpm lint

      - name: Frontend Typecheck (tsc)
        run: pnpm tsc --noEmit

      - name: Frontend Unit Tests (Vitest)
        run: pnpm test

      - name: Frontend Production Build
        run: pnpm build

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Rust Code Formatting Check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Rust Clippy Strict Check
        working-directory: src-tauri
        run: cargo clippy -- -D warnings

      - name: Fetch Cores Binaries
        shell: pwsh
        run: |
          ./scripts/fetch-cores.ps1

      - name: Run Backend Unit & Integration Tests
        working-directory: src-tauri
        run: cargo test --verbose
