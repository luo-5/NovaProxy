name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-release:
    name: Build & Package Windows Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Frontend Dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Download & Verify Proxy Cores
        shell: pwsh
        run: |
          ./scripts/fetch-cores.ps1

      - name: Build Tauri Desktop Bundle (NSIS Installer)
        run: pnpm tauri build --bundles nsis

      - name: Package Portable Zip Archive
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          $portableDir = "dist-portable"
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          
          # Copy compiled binary and resources
          Copy-Item "src-tauri\target\release\novaproxy.exe" -Destination "$portableDir\NovaProxy.exe"
          New-Item -ItemType Directory -Force -Path "$portableDir\resources" | Out-Null
          Copy-Item -Recurse "src-tauri\resources\cores" -Destination "$portableDir\resources\cores"
          
          # Zip archive
          $zipName = "NovaProxy-$ver-windows-x64-portable.zip"
          Compress-Archive -Path "$portableDir\*" -DestinationPath $zipName -Force
          Write-Host "Created portable package: $zipName"

      - name: Compute Checksums (SHA-256)
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path src-tauri\target\release\bundle\nsis\*.exe, ./*portable.zip
          $hashList = foreach ($f in $files) {
              $hash = (Get-FileHash -Path $f.FullName -Algorithm SHA256).Hash.ToLower()
              "$hash  $($f.Name)"
          }
          $hashList | Set-Content -Path "SHA256SUMS.txt"
          Get-Content "SHA256SUMS.txt"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            ./*portable.zip
            SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
