name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (x64 NSIS & Portable)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Download Proxy Cores
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/fetch-cores.ps1 -Platform windows -Arch amd64
      - run: pnpm tauri build --bundles nsis
      - name: Prepare Artifacts
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          $out = "artifacts"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item "src-tauri\target\release\bundle\nsis\*.exe" $out -Force

          $portableDir = "dist-portable"
          New-Item -ItemType Directory -Force -Path "$portableDir\resources" | Out-Null
          Copy-Item "src-tauri\target\release\novaproxy.exe" "$portableDir\NovaProxy.exe"
          Copy-Item -Recurse "src-tauri\resources\cores" "$portableDir\resources\cores"
          Compress-Archive -Path "$portableDir\*" -DestinationPath "$out\NovaProxy-$ver-windows-x64-portable.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: artifacts/*

  build-macos:
    name: Build macOS (${{ matrix.arch_label }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rust_target: aarch64-apple-darwin
            core_arch: arm64
            arch_label: arm64
          - rust_target: x86_64-apple-darwin
            core_arch: amd64
            arch_label: x64
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Download Proxy Cores
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/fetch-cores.sh
          ./scripts/fetch-cores.sh --platform macos --arch ${{ matrix.core_arch }}
      - run: pnpm tauri build --target ${{ matrix.rust_target }} --bundles dmg
      - name: Prepare Artifacts
        run: |
          mkdir -p artifacts
          cp src-tauri/target/${{ matrix.rust_target }}/release/bundle/dmg/*.dmg artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.arch_label }}
          path: artifacts/*

  build-linux:
    name: Build Linux (deb & AppImage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux Tauri Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Download Proxy Cores
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/fetch-cores.sh
          ./scripts/fetch-cores.sh --platform linux --arch amd64
      - name: Build Tauri Bundles
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: pnpm tauri build --bundles deb,appimage
      - name: Prepare Artifacts
        run: |
          mkdir -p artifacts
          cp src-tauri/target/release/bundle/deb/*.deb artifacts/
          cp src-tauri/target/release/bundle/appimage/*.AppImage artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: artifacts/*

  build-android:
    name: Build Android Universal APK (arm64 + x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Initialize & Fetch Android Cores
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: |
          pnpm tauri android init --ci --skip-targets-install
          node scripts/configure-android.mjs
          chmod +x scripts/fetch-cores.sh
          ./scripts/fetch-cores.sh --platform android --arch arm64
          ./scripts/fetch-cores.sh --platform android --arch amd64
      - name: Build Android APK
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: pnpm tauri android build --apk --debug -t aarch64 -t x86_64
      - name: Prepare Artifacts
        run: |
          ver="${GITHUB_REF_NAME#v}"
          mkdir -p artifacts
          apk_file=$(find src-tauri/gen/android/app/build/outputs/apk/universal -name "*.apk" | head -n1)
          cp "$apk_file" "artifacts/NovaProxy-${ver}-android-universal.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: artifacts/*

  publish-release:
    name: Publish Multi-Platform GitHub Release
    needs: [build-windows, build-macos, build-linux, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Compute SHA-256 Checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
