[package]
name = "novaproxy"
version = "0.0.1"
description = "High-performance cross-platform multi-core VPN client"
authors = ["NovaProxy Team"]
license = "MIT"
edition = "2021"

[lib]
name = "novaproxy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "novaproxy"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = [] }
tauri-plugin-shell = "2.0"
tauri-plugin-android-vpn = { path = "plugins/tauri-plugin-android-vpn" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.41", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "registry"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
ts-rs = "10.0"
sha2 = "0.10"
hex = "0.4"
semver = { version = "1.0", features = ["serde"] }
parking_lot = "0.12"
dirs = "7.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks", "stream"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
flate2 = "1.0"
tar = "0.4"
base64 = "0.22"
url = "2.5"
urlencoding = "2.1"
serde_yaml = "0.9"
rqrr = "0.8"
qrcode = "0.14"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "webp"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2.1", features = ["tray-icon"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
